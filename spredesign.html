<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Froozy · redesign-richting</title>
<style>
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-SemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face { font-family:'Amber Whiskey'; src:url('/froozy/fonts/AmberWhiskeyAged.woff2') format('woff2'); font-weight:400; font-display:swap; }
  :root{
    --groen:#304F42; --offwhite:#FFF8E7; --strawberry:#F6B5C5; --mango:#FFF065; --banapple:#C3D76E; --peach:#F9BB7A;
    --p-straw:color-mix(in srgb,#F6B5C5 42%,#FFF8E7);
    --p-mango:color-mix(in srgb,#FFF065 42%,#FFF8E7);
    --p-bana:color-mix(in srgb,#C3D76E 42%,#FFF8E7);
    --p-peach:color-mix(in srgb,#F9BB7A 42%,#FFF8E7);
    --head:'Antonio',system-ui,sans-serif; --disp:'Amber Whiskey','Antonio',serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--offwhite);color:var(--groen);font-family:var(--body);}
  .lbl{max-width:1500px;margin:0 auto;padding:2.2rem 2rem .4rem;}
  .lbl h1{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;font-size:.85rem;margin:0;opacity:.6;}

  .eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--head);font-weight:700;text-transform:uppercase;
    letter-spacing:.2em;font-size:.82rem;color:var(--groen);opacity:.78;margin:0;}
  .eyebrow::before{content:"";width:.42rem;height:.42rem;background:currentColor;transform:rotate(45deg);opacity:.85;}
  .mega{font-family:var(--disp);font-weight:400;color:var(--groen);line-height:.96;letter-spacing:.004em;margin:0;}
  .lead{font-family:var(--body);line-height:1.55;color:var(--groen);opacity:.85;margin:0;max-width:42ch;font-size:1.12rem;}
  .btn{display:inline-flex;align-items:center;gap:.55rem;background:var(--groen);color:var(--offwhite);font-family:var(--head);
    font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;padding:.95rem 1.8rem;border-radius:999px;text-decoration:none;}

  /* ---- A · asymmetrische product-hero ---- */
  .hero{position:relative;overflow:hidden;background:var(--offwhite);}
  .hero__in{max-width:1500px;margin:0 auto;padding:clamp(3rem,6vw,6rem) clamp(1.5rem,4vw,4rem);
    display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:center;min-height:82vh;}
  .hero__text{display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem;}
  .hero .mega{font-size:clamp(2.8rem, 1.5rem + 5vw, 6.4rem);}
  .hero__media{position:relative;justify-self:center;}
  .hero__blob{position:absolute;inset:-6% -10%;background:var(--p-straw);border-radius:48% 52% 55% 45%/50% 46% 54% 50%;z-index:0;}
  .hero__media img{position:relative;z-index:1;width:100%;max-width:560px;height:auto;filter:drop-shadow(0 40px 60px rgba(48,79,66,.28));display:block;}

  /* ---- B · brutaal groen statement ---- */
  .green{background:var(--groen);color:var(--offwhite);text-align:center;}
  .green__in{max-width:1200px;margin:0 auto;padding:clamp(4.5rem,10vw,9rem) clamp(1.5rem,4vw,4rem);display:flex;flex-direction:column;align-items:center;gap:1.8rem;}
  .green .eyebrow{color:var(--offwhite);opacity:.75;}
  .green .mega{color:var(--offwhite);font-size:clamp(2.6rem, 1.4rem + 5.5vw, 7rem);line-height:.98;}
  .dots{display:flex;gap:1rem;margin-top:.5rem;}
  .dots span{width:1rem;height:1rem;transform:rotate(45deg);border-radius:2px;}
  .dots span:nth-child(1){background:var(--strawberry);} .dots span:nth-child(2){background:var(--mango);}
  .dots span:nth-child(3){background:var(--banapple);} .dots span:nth-child(4){background:var(--peach);}

  /* ---- C · macro crrrunch ---- */
  .macro{background:var(--offwhite);}
  .macro__in{max-width:1500px;margin:0 auto;padding:clamp(2.5rem,5vw,5rem) clamp(1.5rem,4vw,4rem);
    display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:center;}
  .macro__img{border-radius:26px;overflow:hidden;aspect-ratio:4/3;background:var(--p-peach);}
  .macro__img img{width:100%;height:100%;object-fit:cover;display:block;}
  .macro__text{display:flex;flex-direction:column;align-items:flex-start;gap:1.2rem;}
  .macro .mega{font-size:clamp(3rem, 2rem + 5vw, 7rem);}
  .macro .mega em{font-style:normal;color:var(--peach);}

  @media(max-width:820px){
    .hero__in,.macro__in{grid-template-columns:1fr;min-height:0;}
    .hero__media{order:-1;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const A = `
  <section class="hero">
    <div class="hero__in">
      <div class="hero__text">
        <p class="eyebrow">Gevriesdroogd fruit</p>
        <h1 class="mega">Zo knapperig<br>kan fruit zijn.</h1>
        <p class="lead">Echt, rijp fruit — alleen het water eruit. Meer smaak, luchtiger fruit, en een crrrunch die je nog nooit van fruit hoorde.</p>
        <a class="btn" href="#">Proef de crrrunch →</a>
      </div>
      <div class="hero__media">
        <div class="hero__blob"></div>
        <img src="/froozy/assets/gen/crunch-straw.webp" alt="Froozy aardbei-appel met spattend fruit">
      </div>
    </div>
  </section>`;

  const B = `
  <section class="green">
    <div class="green__in">
      <p class="eyebrow">Puur natuur</p>
      <h2 class="mega">Geen troep.<br>Geen geheimen.<br>Alleen fruit.</h2>
      <div class="dots"><span></span><span></span><span></span><span></span></div>
    </div>
  </section>`;

  const C = `
  <section class="macro">
    <div class="macro__in">
      <div class="macro__img"><img src="/froozy/assets/usp/burst.webp" alt="Uitbarsting van gevriesdroogd fruit"></div>
      <div class="macro__text">
        <p class="eyebrow">Voel het</p>
        <h2 class="mega"><em>Crrrunch.</em></h2>
        <p class="lead">Vriesdrogen maakt fruit luchtig en breekbaar. Eén hap en je hoort waarom Froozy geen gewone snack is.</p>
      </div>
    </div>
  </section>`;

  document.getElementById('app').innerHTML =
    `<div class="lbl"><h1>A · asymmetrische product-hero</h1></div>${A}`+
    `<div class="lbl"><h1>B · brutaal groen statement</h1></div>${B}`+
    `<div class="lbl"><h1>C · macro "crrrunch"-moment</h1></div>${C}`;
</script>
</body>
</html>
