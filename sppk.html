<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Froozy · statement in volle-breedte roze balk (5 opties)</title>
<style>
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-SemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face { font-family:'Amber Whiskey'; src:url('/froozy/fonts/AmberWhiskeyAged.woff2') format('woff2'); font-weight:400; font-display:swap; }
  :root{
    --groen:#304F42; --offwhite:#FFF8E7; --strawberry:#F6B5C5;
    --pastel-strawberry:color-mix(in srgb,#F6B5C5 42%,#FFF8E7);
    --head:'Antonio',system-ui,sans-serif; --disp:'Amber Whiskey','Antonio',serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#efe7cf;color:var(--groen);font-family:var(--body);}
  .lbl{max-width:1680px;margin:2.6rem auto .55rem;padding:0 1.5rem;}
  .lbl h1{font-family:var(--head);text-transform:uppercase;letter-spacing:.11em;font-size:.98rem;margin:0;}
  .ver{width:100%;background:var(--pastel-strawberry);overflow:hidden;}
  .wrap{max-width:1680px;margin:0 auto;padding:clamp(2rem,3.6vw,3.6rem) clamp(1.6rem,4vw,4.2rem);}
  img{display:block;}

  .title{font-family:var(--disp);font-weight:400;color:var(--groen);line-height:1.05;letter-spacing:.006em;margin:0;}
  .hook{font-family:var(--body);line-height:1.6;color:var(--groen);opacity:.9;margin:0;font-size:1.05rem;}
  .hook .lead{font-weight:800;opacity:1;}
  .points{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.55rem 1.25rem;}
  .points li{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:.9rem;color:var(--groen);}
  .points li::before{content:"";width:.46rem;height:.46rem;background:var(--groen);transform:rotate(45deg);opacity:.82;flex:none;}

  .bags{display:flex;gap:clamp(.6rem,1.4vw,1.3rem);align-items:flex-end;justify-content:center;}
  .bags img{width:100%;max-width:23%;height:auto;filter:drop-shadow(0 16px 28px rgba(48,79,66,.22));}
  .bags.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.7rem,1.5vw,1.3rem);}
  .bags.grid img{max-width:100%;}

  /* V1 tekst links · zakken rechts (referentie) */
  .v1{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(1.6rem,3.5vw,3.6rem);align-items:center;}
  .v1 .title{font-size:clamp(2rem, 1rem + 2.4vw, 3.2rem);}
  .v1 .hook{max-width:42ch;margin-top:1.1rem;}
  .v1 .points{margin-top:1.2rem;}

  /* V2 gecentreerd · zakken eronder */
  .v2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(1.2rem,2.6vw,2rem);}
  .v2 .title{font-size:clamp(2.4rem, 1.4rem + 3.2vw, 4.4rem);white-space:nowrap;}
  .v2 .hook{max-width:66ch;text-wrap:balance;}
  .v2 .points{justify-content:center;}
  .v2 .bags{width:100%;margin-top:.4rem;}

  /* V3 titel boven · zakken midden · tekst eronder (sandwich) */
  .v3{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(1.1rem,2.4vw,1.9rem);}
  .v3 .title{font-size:clamp(2.4rem, 1.4rem + 3.2vw, 4.4rem);white-space:nowrap;}
  .v3 .bags{width:100%;}
  .v3 .hook{max-width:62ch;text-wrap:balance;}
  .v3 .points{justify-content:center;}

  /* V4 zakken 2×2 links · tekst rechts */
  .v4{display:grid;grid-template-columns:1fr 1.08fr;gap:clamp(1.6rem,3.5vw,3.6rem);align-items:center;}
  .v4 .title{font-size:clamp(2rem, 1rem + 2.6vw, 3.6rem);}
  .v4 .hook{max-width:46ch;margin-top:1rem;}
  .v4 .points{margin-top:1.1rem;}

  /* V5 titel links + zakken rechts, hook/punten als strook onderaan */
  .v5{display:flex;flex-direction:column;gap:clamp(1.4rem,3vw,2.6rem);}
  .v5 .top{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(1.6rem,3.5vw,3.6rem);align-items:center;}
  .v5 .title{font-size:clamp(2rem, 1rem + 2.6vw, 3.8rem);}
  .v5 .strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 2rem;border-top:1.5px solid rgba(48,79,66,.2);padding-top:clamp(1rem,2vw,1.6rem);}
  .v5 .strip .hook{max-width:58ch;}
</style>
</head>
<body>
<div id="app"></div>
<script>
  const P = ['mango-pineapple','banana-apple','strawberry-apple','banana-peach'];
  const bags = (cls='') => `<div class="bags ${cls}">${P.map(s=>`<img src="/froozy/assets/packshots/${s}.webp" alt="Froozy ${s}">`).join('')}</div>`;
  const title = () => `<h2 class="title">Iedereen kent fruit.<br>Niemand kent het zó crrrunchy.</h2>`;
  const HOOK = 'Neem echt, rijp fruit en haal alleen het water eruit — en er gebeurt iets wonderlijks: een crrrunch die je nog nooit van fruit hoorde. Snacken zónder schuldgevoel, boordevol smaak.';
  const PTS = ['100% echt fruit','Geen suiker','Rijk aan vezels','100% vegan'];
  const points = () => `<ul class="points">${PTS.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  const hook = () => `<p class="hook"><span class="lead">Dit is Froozy.</span> ${HOOK}</p>`;

  const V = [
    ['1 · Tekst links · 4 zakken rechts (referentie-stijl)',
      `<div class="wrap v1"><div><h2 class="title">Iedereen kent fruit.<br>Niemand kent het zó crrrunchy.</h2>${hook()}${points()}</div>${bags()}</div>`],
    ['2 · Alles gecentreerd · 4 zakken op een rij eronder',
      `<div class="wrap v2">${title()}${hook()}${points()}${bags()}</div>`],
    ['3 · Titel boven · zakken in het midden · tekst + punten eronder (sandwich)',
      `<div class="wrap v3">${title()}${bags()}${hook()}${points()}</div>`],
    ['4 · Zakken 2×2 links · tekst rechts',
      `<div class="wrap v4">${bags('grid')}<div><h2 class="title">Iedereen kent fruit.<br>Niemand kent het zó crrrunchy.</h2>${hook()}${points()}</div></div>`],
    ['5 · Titel links + zakken rechts · hook & punten als strook onderaan',
      `<div class="wrap v5"><div class="top"><h2 class="title">Iedereen kent fruit.<br>Niemand kent het zó crrrunchy.</h2>${bags()}</div><div class="strip">${hook()}${points()}</div></div>`],
  ];
  document.getElementById('app').innerHTML = V.map(([name, html]) =>
    `<div class="lbl"><h1>${name}</h1></div><section class="ver">${html}</section>`).join('');
</script>
</body>
</html>
