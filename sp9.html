<!doctype html>
<html lang="nl">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Froozy · variant 9 omgedraaid</title>
<style>
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-SemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face { font-family:'Amber Whiskey'; src:url('/froozy/fonts/AmberWhiskeyAged.woff2') format('woff2'); font-weight:400; font-display:swap; }
  :root{
    --groen:#304F42; --offwhite:#FFF8E7; --strawberry:#F6B5C5;
    --pastel-strawberry:color-mix(in srgb,#F6B5C5 42%,#FFF8E7);
    --head:'Antonio',system-ui,sans-serif; --disp:'Amber Whiskey','Antonio',serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#efe7cf;color:var(--groen);font-family:var(--body);}
  .lbl{max-width:1180px;margin:2.4rem auto 0.5rem;padding:0 1.5rem;}
  .lbl h1{font-family:var(--head);text-transform:uppercase;letter-spacing:.12em;font-size:.9rem;margin:0;}
  .ver{max-width:1180px;margin:0 auto 2rem;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -46px rgba(48,79,66,.5);background:var(--offwhite);}
  .inner{padding:clamp(1.6rem,3vw,2.6rem) clamp(1.6rem,3.5vw,3rem);min-height:86vh;display:flex;flex-direction:column;gap:clamp(1rem,2.4vw,1.8rem);}
  img{display:block;}

  .textblock{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(.9rem,1.9vw,1.5rem);padding-top:clamp(.6rem,2.2vh,1.8rem);}
  .title{font-family:var(--disp);font-weight:400;color:var(--groen);line-height:1.06;letter-spacing:.006em;margin:0;font-size:clamp(2.6rem, 1.6rem + 3.4vw, 4.6rem);white-space:nowrap;}
  .hook{font-family:var(--body);font-size:1.08rem;line-height:1.6;color:var(--groen);opacity:.9;margin:0;max-width:62ch;text-wrap:balance;}
  .hook .lead{font-weight:800;opacity:1;}
  .points{list-style:none;margin:.1rem 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem 1.3rem;}
  .points li{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:.9rem;color:var(--groen);}
  .points li::before{content:"";width:.46rem;height:.46rem;background:var(--groen);transform:rotate(45deg);opacity:.82;flex:none;}

  .packs{flex:1 1 50%;min-height:42vh;display:flex;gap:clamp(.7rem,1.6vw,1.4rem);align-items:center;justify-content:center;
    background:var(--pastel-strawberry);border-radius:24px;padding:clamp(1.2rem,2.6vw,2rem) clamp(1.2rem,3vw,2.4rem);}
  .packs img{width:100%;max-width:23%;height:auto;filter:drop-shadow(0 18px 30px rgba(48,79,66,.24));}
</style>
</head>
<body>
<div id="app"></div>
<script>
  const P = ['mango-pineapple','banana-apple','strawberry-apple','banana-peach'];
  const packs = () => `<div class="packs">${P.map(s=>`<img src="/froozy/assets/packshots/${s}.webp" alt="Froozy ${s}">`).join('')}</div>`;
  const title = () => `<h2 class="title">Iedereen kent fruit.<br>Niemand kent het zó crrrunchy.</h2>`;
  const HOOK = 'Neem echt, rijp fruit en haal alleen het water eruit — en er gebeurt iets wonderlijks: een crrrunch die je nog nooit van fruit hoorde. Snacken zónder schuldgevoel, boordevol smaak.';
  const PTS = ['100% echt fruit','Geen suiker','Rijk aan vezels','100% vegan'];
  const points = () => `<ul class="points">${PTS.map(p=>`<li>${p}</li>`).join('')}</ul>`;

  const V = [
    ['9 · titel iets kleiner · "Dit is Froozy" vet in de tekst · zakken = onderste helft', `<div class="textblock">${title()}<p class="hook"><span class="lead">Dit is Froozy.</span> ${HOOK}</p>${points()}</div>${packs()}`],
  ];
  document.getElementById('app').innerHTML = V.map(([name, html]) =>
    `<div class="lbl"><h1>${name}</h1></div><section class="ver"><div class="inner">${html}</div></section>`).join('');
</script>
</body>
</html>
