<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Froozy · USP-sectie: 2 versies</title>
<style>
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-SemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
  @font-face { font-family:'Antonio'; src:url('/froozy/fonts/Antonio-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face { font-family:'Amber Whiskey'; src:url('/froozy/fonts/AmberWhiskeyAged.woff2') format('woff2'); font-weight:400; font-display:swap; }
  :root{
    --groen:#304F42; --offwhite:#FFF8E7; --mango:#FFF065; --banapple:#C3D76E; --strawberry:#F6B5C5; --peach:#F9BB7A;
    --pastel-mango:color-mix(in srgb,var(--mango) 42%,var(--offwhite));
    --pastel-banapple:color-mix(in srgb,var(--banapple) 42%,var(--offwhite));
    --pastel-strawberry:color-mix(in srgb,var(--strawberry) 42%,var(--offwhite));
    --pastel-peach:color-mix(in srgb,var(--peach) 42%,var(--offwhite));
    --head:'Antonio',system-ui,sans-serif; --disp:'Amber Whiskey','Antonio',serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#efe7cf;color:var(--groen);font-family:var(--body);}
  .lbl{max-width:1180px;margin:0 auto;padding:2.2rem 1.5rem 0.6rem;}
  .lbl h1{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;font-size:.82rem;margin:0;}
  .lbl p{margin:.3rem 0 0;font-size:.9rem;opacity:.65;}
  .ver{background:var(--offwhite);max-width:1180px;margin:0 auto 2rem;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px -45px rgba(48,79,66,.5);}
  .inner{padding:clamp(2rem,4vw,3.2rem) clamp(1.5rem,4vw,3.5rem);}

  /* gedeelde kop */
  .cap{text-align:center;max-width:22ch;margin:0 auto clamp(1.8rem,3.4vw,3rem);}
  .cap .k{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:.92rem;color:var(--groen);opacity:.72;}
  .cap .h{font-family:var(--disp);font-size:clamp(2.6rem,1.5rem+3.8vw,4.6rem);line-height:1.0;margin-top:.5rem;color:var(--groen);text-wrap:balance;}

  /* ---------- VERSIE 1 — witte kaartjes met foto + tekst (3 passend op 1 scherm) ---------- */
  .v1grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.9rem,1.6vw,1.4rem);}
  .v1card{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 30px -28px rgba(48,79,66,.5);}
  .v1card__img{height:clamp(150px,22vh,215px);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:.7rem;}
  .v1card__img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(48,79,66,.18));}
  .v1card__img--fill{padding:0;}
  .v1card__img--fill img{object-fit:cover;filter:none;}
  .v1card__img--contain img{object-fit:contain;}
  .v1card__img--top img{object-position:top;}
  .v1card__b{padding:1rem 1.15rem 1.25rem;border-top:1px solid color-mix(in srgb,var(--groen) 8%,#fff);}
  .v1card__h{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:1.18rem;color:var(--groen);line-height:1.05;}
  .v1card__t{font-size:.95rem;line-height:1.45;color:var(--groen);opacity:.82;margin-top:.45rem;}

  /* ---------- VERSIE 2 — buah split-panels (6, om en om) ---------- */
  .v2wrap{display:flex;flex-direction:column;gap:clamp(1rem,2vw,1.6rem);}
  .v2row{display:grid;grid-template-columns:1fr 1fr;min-height:clamp(300px,34vw,420px);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 20px 40px -32px rgba(48,79,66,.45);}
  .v2row__img{display:flex;align-items:center;justify-content:center;padding:clamp(1.2rem,3vw,2.6rem);min-height:200px;}
  .v2row__img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 20px rgba(48,79,66,.20));}
  .v2row__img--fill{padding:0;}
  .v2row__img--fill img{object-fit:cover;filter:none;}
  .v2row__img--contain img{object-fit:contain;}
  .v2row__img--top img{object-position:top;}
  .v2row__txt{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(1.6rem,3.5vw,3rem);gap:.4rem;}
  .v2row__k{font-family:var(--disp);font-size:clamp(1.45rem,1rem+1.2vw,2.2rem);color:var(--groen);opacity:.9;}
  .v2row__h{font-family:var(--head);font-weight:700;font-size:clamp(2.1rem,1.4rem+2.7vw,3.6rem);line-height:.98;color:var(--groen);margin:.15rem 0 .55rem;}
  .v2row__p{font-size:clamp(.9rem,.85rem+.25vw,1.02rem);line-height:1.6;color:var(--groen);opacity:.85;max-width:44ch;}
  .v2row--rev .v2row__img{order:2;}
  .v2row--rev .v2row__txt{order:1;}

  @media(max-width:760px){ .v1grid{grid-template-columns:1fr 1fr;} .v2row{grid-template-columns:1fr;} .v2row__img{min-height:230px;} .v2row--rev .v2row__img{order:0;} .v2row--rev .v2row__txt{order:0;} }
  @media(max-width:460px){ .v1grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // gedeelde data — DEZELFDE 6 foto's voor beide versies
  const U = [
    { key:'echt-fruit',       accent:'strawberry', fill:true, fit:'contain', h:'100% echt fruit',
      t:'Vers fruit, gevriesdroogd. En verder helemaal niks.',
      k:'Puur natuur.',
      p:'We nemen alleen vers, rijp fruit en vriesdrogen het — meer gebeurt er niet. Geen concentraat, geen toevoegingen, geen trucjes. Wat je proeft is puur fruit, met alle smaak en voedingsstoffen intact.' },
    { key:'geen-suiker',      accent:'strawberry', fill:true, h:'Geen toegevoegde suikers',
      t:'Alleen de natuurlijke zoetheid van het fruit zelf.',
      k:'Zoet van zichzelf.',
      p:'Fruit is van nature al zoet genoeg — daar hoeft niks bij. Bij Froozy vind je dan ook geen greintje toegevoegde suiker. Alleen de eerlijke, natuurlijke zoetheid die het fruit zelf meebrengt.' },
    { key:'vegan',            accent:'banapple',   fill:true, pos:'top', h:'100% vegan',
      t:'Plantaardig, voor iedereen een crrrunch.',
      k:'Plantaardig.',
      p:'Van begin tot eind volledig plantaardig. Geen dierlijke ingrediënten, geen uitzonderingen — gewoon fruit. Zo kan iedereen mee-crrrunchen, wat je eetstijl ook is.' },
    { key:'vezels',           accent:'peach',      fill:true, h:'Rijk aan vezels',
      t:'Van nature vol vezels, want er gaat niks verloren.',
      k:'Vol goeds.',
      p:'Omdat we het héle stuk fruit gebruiken en niets weggooien, blijven alle vezels behouden. Goed voor je spijsvertering én dat lekker verzadigde gevoel — precies zoals de natuur het bedoelde.' },
    { key:'kcal',             accent:'strawberry', fill:true, h:'~55 kcal per portie',
      t:'Licht als een veertje, maar nooit saai.',
      k:'Luchtig.',
      p:'Een portie Froozy is met zo\'n 55 kcal heerlijk licht. Door het vriesdrogen wordt fruit luchtig en knapperig, dus je snackt volop smaak zonder dat het zwaar op de maag ligt.' },
    { key:'twee-ingredienten',accent:'banapple',   fill:true, h:'Slechts 2 ingrediënten',
      t:'Fruit. En nog een fruit. That\'s it.',
      k:'Simpel.',
      p:'Lees het etiket maar: twee soorten fruit, meer niet. Geen namen die je niet kunt uitspreken, geen verborgen toevoegingen. Zo simpel en eerlijk hoort een snack te zijn.' },
  ];
  const cap = `<div class="cap"><div class="k">◆ Dit is Froozy</div><div class="h">Froozy is niets anders dan puur vers fruit, niets anders dan natuur.</div></div>`;
  const src = (u)=>`/assets/usp/${u.key}.webp`;

  const v1 = `
    <div class="lbl"><h1>Versie 1 — witte kaartjes met foto + tekst</h1><p>Wit (geen kleur), compact zodat 3 op 1 scherm passen en 3 eronder. Zelfde 6 foto's als versie 2.</p></div>
    <section class="ver"><div class="inner">${cap}
      <div class="v1grid">${U.map(u=>`
        <div class="v1card">
          <div class="v1card__img ${u.fill?'v1card__img--fill':''} ${u.fit==='contain'?'v1card__img--contain':''} ${u.pos==='top'?'v1card__img--top':''}"><img src="${src(u)}" alt=""></div>
          <div class="v1card__b"><div class="v1card__h">${u.h}</div><div class="v1card__t">${u.t}</div></div>
        </div>`).join('')}
      </div></div></section>`;

  const v2 = `
    <div class="lbl"><h1>Versie 2 — buah split-panels (6, om en om)</h1><p>Grote foto naast een tekstblok, om en om links/rechts. Uitgebreidere tekst per punt. Zelfde 6 foto's als versie 1.</p></div>
    <section class="ver"><div class="inner">${cap}
      <div class="v2wrap">${U.map((u,i)=>`
        <div class="v2row ${i%2?'v2row--rev':''}">
          <div class="v2row__img ${u.fill?'v2row__img--fill':''} ${u.fit==='contain'?'v2row__img--contain':''} ${u.pos==='top'?'v2row__img--top':''}" style="background:var(--pastel-${u.accent})"><img src="${src(u)}" alt=""></div>
          <div class="v2row__txt">
            <div class="v2row__k">${u.k}</div>
            <div class="v2row__h">${u.h}</div>
            <div class="v2row__p">${u.p}</div>
          </div>
        </div>`).join('')}
      </div></div></section>`;

  document.getElementById('app').innerHTML = v1 + v2;
</script>
</body>
</html>
